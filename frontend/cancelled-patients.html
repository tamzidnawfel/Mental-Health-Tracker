<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancelled Patients - MindCare Provider Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/provider-dashboard.css">
    <link rel="stylesheet" href="css/provider-analysis.css">
</head>
<body>
    <header class="provider-header">
        <div class="header-container">
            <a href="provider-dashboard.html" class="brand-link"><div class="brand-logo-icon">🩺</div><div class="brand-text"><span class="brand-name">MindCare</span><span class="brand-badge">Provider Portal</span></div></a>
            <div class="header-actions"><span class="provider-page-name" id="providerName">Provider Workspace</span><a class="btn-refresh" href="provider-dashboard.html">← Dashboard</a></div>
        </div>
    </header>
    <main class="analysis-main">
        <div class="analysis-container">
            <div class="page-heading"><div><span class="eyebrow">CANCELLATION ANALYSIS</span><h1>Cancelled patients</h1><p>Appointments marked as cancelled for your provider account.</p></div><div class="heading-stat"><strong id="cancelledCount">0</strong><span>Cancelled appointments</span></div></div>
            <div class="analysis-toolbar"><label for="cancelledDistrict">District</label><select id="cancelledDistrict"><option value="all">All districts</option></select><label for="cancelledSort">Sort by</label><select id="cancelledSort"><option value="district">District (A-Z)</option><option value="date">Appointment date (newest)</option></select></div>
            <section class="analysis-panel"><div class="table-container"><table class="clinical-table"><thead><tr><th>Patient</th><th>District</th><th>Appointment date</th><th>Cancellation date</th><th>Reason</th><th>Service / provider</th><th>Status</th></tr></thead><tbody id="cancelledBody"><tr><td colspan="7" class="loading-td"><div class="spinner-inline"></div> Loading cancelled patients...</td></tr></tbody></table></div></section>
        </div>
    </main>
    <script src="js/cancelled-patients.js"></script>
</body>
</html>
