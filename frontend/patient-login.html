<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login - MindCare</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/register.css">
</head>

<body>

    <div class="container">
        <h1>Patient Login</h1>
        <p class="subtitle">Enter your registered Email and Password to enter</p>

        <!-- Feedback Message Alert Box -->
        <div id="alertBox" class="alert-box"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Patient Email Address</label>
                <input type="email" id="email" name="email" required placeholder="e.g. example@gmail.com"
                    autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your generated password"
                    autocomplete="current-password">
            </div>

            <button type="submit" id="loginBtn" class="btn-with-icon">
                <span>Login &amp; Enter</span>
                <span class="login-icon-badge">➔</span>
            </button>
        </form>

        <div class="login-prompt">
            <span>Don't have an account?</span>
            <a href="patient-registration.html" class="login-link">
                Register as Patient <span class="login-icon-badge">+</span>
            </a>
        </div>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script src="js/patient-login.js"></script>

</body>

</html>
